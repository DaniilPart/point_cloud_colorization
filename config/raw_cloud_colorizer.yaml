raw_cloud_colorizer:
  ros__parameters:
    input_cloud_topic: /liorf/mapping/keyframes/cloud_deskewed_downsampled
    input_image_topic: /camera_front/image_raw/compressed
    input_image_topic_raw: /camera_front/image_raw
    camera_info_topic: /camera_front/camera_info
    output_cloud_topic: /colorizer/raw/colored_cloud
    debug_image_topic: /colorizer/raw/debug_overlay
    output_frame_id: ""
    publish_only_colored_points: true
    debug_overlay_point_radius: 2
    use_fixed_sync: false
    fixed_sync_image_stream: compressed
    source_selector_max_compressed_frames: 10
    source_selector_max_wait_sec: 0.5
    transform_source: config
    camera_frame_id: pylon_camera
    lidar_frame_id: os1/os_lidar
    transform_lookup_timeout_sec: 0.1
    sync_queue_size: 10

    camera_to_lidar_matrix: [
      0.019, 0.0, -1.0, -0.058,
      -1.0, 0.0, -0.019, -0.001,
      0.0, 1.0, 0.0, -0.145,
      0.0, 0.0, 0.0, 1.0
    ]

    sky_filter_enabled: true
    sky_region_max_y_fraction: 0.5
    sky_region_invert_y: true
    sky_blue_h_min: 90
    sky_blue_h_max: 130
    sky_blue_s_min: 25
    sky_blue_v_min: 135
    sky_cloud_s_max: 40
    sky_cloud_v_min: 155